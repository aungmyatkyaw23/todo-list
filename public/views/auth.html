<section class="auth-shell">
  <div class="auth-card card">
    <div class="auth-copy">
      <p class="eyebrow">Your focused workspace</p>
      <h1>FocusFlow</h1>
      <p>Sign in to manage your tasks, or create an account to get started.</p>
    </div>

    <div class="auth-tabs">
      <button class="tab-button active" type="button" data-auth-mode="login">Login</button>
      <button class="tab-button" type="button" data-auth-mode="register">Register</button>
    </div>

    <form id="loginForm" class="auth-form" data-auth-panel="login">
      <label>Email <input name="email" type="email" autocomplete="email" required /></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="primary-button" type="submit">Log in</button>
      <button class="link-button" type="button" data-auth-mode="forgot">Forgot password?</button>
    </form>

    <form id="registerForm" class="auth-form hidden" data-auth-panel="register">
      <label>Name <input name="name" type="text" maxlength="80" autocomplete="name" required /></label>
      <label>Email <input name="email" type="email" autocomplete="email" required /></label>
      <label>Password <input name="password" type="password" minlength="6" autocomplete="new-password" required /></label>
      <button class="primary-button" type="submit">Create account</button>
      <button class="link-button" type="button" data-auth-mode="login">Already have an account? Log in</button>
    </form>

    <form id="forgotForm" class="auth-form hidden" data-auth-panel="forgot">
      <h2>Reset password</h2>
      <p>Enter your account email and we’ll send a six-digit reset code.</p>
      <label>Email <input name="email" type="email" autocomplete="email" required /></label>
      <button class="primary-button" type="submit">Send code</button>
      <button class="link-button" type="button" data-auth-mode="login">Back to login</button>
    </form>

    <form id="verifyForm" class="auth-form hidden" data-auth-panel="verify">
      <h2>Check your email</h2>
      <label>Reset code <input name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required /></label>
      <button class="primary-button" type="submit">Verify code</button>
      <button class="link-button" type="button" data-auth-mode="forgot">Use another email</button>
    </form>

    <form id="resetForm" class="auth-form hidden" data-auth-panel="reset">
      <h2>Choose a new password</h2>
      <label>New password <input name="newPassword" type="password" minlength="6" autocomplete="new-password" required /></label>
      <label>Confirm password <input name="newConfirmPassword" type="password" minlength="6" autocomplete="new-password" required /></label>
      <button class="primary-button" type="submit">Reset password</button>
    </form>

    <p id="authMessage" class="auth-message" aria-live="polite"></p>
  </div>
</section>
