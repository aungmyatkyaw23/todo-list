<section class="game-page card">
  <p class="eyebrow">A short break</p>
  <h1>Tic-tac-toe</h1>
  <p id="gameMessage" aria-live="polite"></p>
  <div id="board" class="game-board" aria-label="Tic-tac-toe board">
    <button class="square" type="button" aria-label="Top left"></button><button class="square" type="button" aria-label="Top middle"></button><button class="square" type="button" aria-label="Top right"></button>
    <button class="square" type="button" aria-label="Middle left"></button><button class="square" type="button" aria-label="Center"></button><button class="square" type="button" aria-label="Middle right"></button>
    <button class="square" type="button" aria-label="Bottom left"></button><button class="square" type="button" aria-label="Bottom middle"></button><button class="square" type="button" aria-label="Bottom right"></button>
  </div>
  <button id="restartButton" class="ghost-button" type="button">Restart</button>
</section>
